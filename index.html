<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>食費管理</title>
<meta name="theme-color" content="#2e5e4a">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="食費管理">
<style>
  :root{
    --green:#2e5e4a; --green-dark:#24503d; --bg:#f4f6f5; --card:#ffffff;
    --text:#1c2420; --dim:#6b7670; --border:#dde3e0; --danger:#c0392b;
    --surface2:#eef1f0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--text); font-size:16px; line-height:1.5;
    padding:16px 14px 40px;
  }
  .wrap{max-width:520px; margin:0 auto;}
  header{display:flex; align-items:baseline; justify-content:space-between; margin:2px 2px 10px;}
  h1{font-size:20px; margin:0; color:var(--green-dark);}
  #syncStatus{font-size:12px; color:var(--dim);}
  #syncStatus.ok{color:var(--green);}
  #syncStatus.err{color:var(--danger);}
  .card{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px;}
  .periodLabel{font-size:13px; color:var(--dim); margin-bottom:6px;}
  .remainRow{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 18px;}
  .remainMain .label, .perDay .label{font-size:13px; color:var(--dim); display:block;}
  .remainMain .value{font-size:34px; font-weight:800; font-variant-numeric:tabular-nums;}
  .remainMain .value.negative{color:var(--danger);}
  .perDay .value{font-size:22px; font-weight:700; font-variant-numeric:tabular-nums;}
  .subInfo{font-size:13px; color:var(--dim); margin-top:6px; font-variant-numeric:tabular-nums;}
  .banner{
    display:block; width:100%; height:190px; object-fit:cover; object-position:50% 52%;
    border-radius:14px; border:1px solid var(--border); margin-bottom:12px; background:var(--surface2);
  }
  .barOuter{height:10px; background:var(--surface2); border-radius:5px; overflow:hidden; margin-top:10px;}
  .barInner{height:100%; background:var(--green); border-radius:5px; transition:width .3s;}
  .barInner.over{background:var(--danger);}
  .modeToggle{display:flex; border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:10px;}
  .modeToggle button{
    flex:1; padding:12px 0; font-size:16px; font-weight:700; border:0; cursor:pointer;
    background:var(--surface2); color:var(--dim);
  }
  .modeToggle button.active{background:var(--green); color:#fff;}
  .amountRow{display:flex; gap:8px;}
  #amountInput, #aAmountInput{
    flex:1; min-width:0; font-size:20px; padding:12px; border:1px solid var(--border);
    border-radius:10px; font-variant-numeric:tabular-nums; background:#fff; color:var(--text);
  }
  #addBtn, #aAddBtn{
    padding:12px 22px; font-size:17px; font-weight:800; border:0; border-radius:10px;
    background:var(--green); color:#fff; cursor:pointer;
  }
  #addBtn:disabled, #aAddBtn:disabled{opacity:.45;}
  #memoInput, #aMemoInput{
    width:100%; margin-top:8px; font-size:16px; padding:11px 12px; border:1px solid var(--border);
    border-radius:10px; background:#fff; color:var(--text);
  }
  #remainHint, #aRemainHint{font-size:13px; color:var(--dim); margin-top:8px; font-variant-numeric:tabular-nums; display:none;}
  #formError, #aFormError{font-size:13px; color:var(--danger); margin-top:8px; display:none;}
  ul.entries{list-style:none; margin:0; padding:0;}
  ul.entries li{
    display:flex; align-items:baseline; gap:8px; padding:10px 2px;
    border-bottom:1px solid var(--border);
  }
  ul.entries li:last-child{border-bottom:0;}
  .eDate{font-size:13px; color:var(--dim); font-variant-numeric:tabular-nums; flex-shrink:0; width:38px;}
  .eBody{flex:1; min-width:0; word-break:break-word; font-size:15px;}
  .eBadge{
    display:inline-block; background:var(--surface2); color:var(--dim); font-size:11px; font-weight:700;
    border-radius:4px; padding:1px 5px; margin-right:5px; vertical-align:middle;
  }
  .eDelta{font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums;}
  .eMemo{font-size:13px; color:var(--dim); margin-left:4px;}
  .eAmount{font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; flex-shrink:0;}
  .eDel{
    flex-shrink:0; border:0; background:none; color:var(--dim); font-size:22px; line-height:1;
    padding:4px 8px; cursor:pointer;
  }
  .emptyNote{font-size:14px; color:var(--dim); padding:6px 2px;}
  .settingsToggle{
    border:0; background:none; color:var(--dim); font-size:14px; text-decoration:underline;
    text-underline-offset:3px; padding:6px 2px; cursor:pointer;
  }
  #settingsBox, #aSettingsBox{display:none; margin-top:8px;}
  #settingsBox.open, #aSettingsBox.open{display:block;}
  .setRow{display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap;}
  .setRow label{font-size:15px; color:var(--dim); display:flex; align-items:center; gap:8px;}
  .setRow input{
    width:130px; font-size:17px; padding:10px; border:1px solid var(--border); border-radius:10px;
    font-variant-numeric:tabular-nums;
  }
  .setRow input.small{width:80px;}
  #saveSettingsBtn, #aSaveSettingsBtn{
    padding:11px 20px; font-size:16px; font-weight:700; border:0; border-radius:10px;
    background:var(--green); color:#fff; cursor:pointer;
  }
  #saveSettingsBtn:disabled, #aSaveSettingsBtn:disabled{opacity:.45;}
  #settingsMsg, #aSettingsMsg{font-size:13px; color:var(--green); display:none;}
  .loading{color:var(--dim); font-size:14px; padding:20px 0; text-align:center;}
  .cardTitle{font-size:16px; font-weight:800; color:var(--green-dark); margin:0 0 10px;}
  .shopRow{display:flex; gap:8px;}
  #shopInput{
    flex:1; min-width:0; font-size:16px; padding:12px; border:1px solid var(--border);
    border-radius:10px; background:#fff; color:var(--text);
  }
  #shopAddBtn{
    padding:12px 22px; font-size:17px; font-weight:800; border:0; border-radius:10px;
    background:var(--green); color:#fff; cursor:pointer;
  }
  #shopAddBtn:disabled{opacity:.45;}
  ul.shopList{list-style:none; margin:6px 0 0; padding:0;}
  ul.shopList li{
    display:flex; align-items:center; gap:10px; padding:10px 2px;
    border-bottom:1px solid var(--border);
  }
  ul.shopList li:last-child{border-bottom:0;}
  .sCheck{width:24px; height:24px; flex-shrink:0; accent-color:var(--green); cursor:pointer; margin:0;}
  .sName{flex:1; min-width:0; word-break:break-word; font-size:16px; cursor:pointer;}
  li.done .sName{color:var(--dim); text-decoration:line-through;}
  .sDel{
    flex-shrink:0; border:0; background:none; color:var(--dim); font-size:22px; line-height:1;
    padding:4px 8px; cursor:pointer;
  }
  #clearDoneBtn{
    border:0; background:none; color:var(--dim); font-size:13px; text-decoration:underline;
    text-underline-offset:3px; padding:8px 2px 0; cursor:pointer; display:none;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>食費管理</h1>
    <span id="syncStatus">接続中…</span>
  </header>

  <div class="card">
    <div class="periodLabel" id="periodLabel">読み込み中…</div>
    <div class="remainRow">
      <div class="remainMain">
        <span class="label">残り</span>
        <span class="value" id="remainValue">―</span>
      </div>
      <div class="perDay">
        <span class="label">1日あたり</span>
        <span class="value" id="perDayValue">―</span>
      </div>
    </div>
    <p class="subInfo" id="subInfo"></p>
    <div class="barOuter"><div class="barInner" id="barInner" style="width:0%"></div></div>
  </div>

  <div class="card">
    <p class="cardTitle">秋菜の食費</p>
    <div class="periodLabel" id="aPeriodLabel">読み込み中…</div>
    <div class="remainRow">
      <div class="remainMain">
        <span class="label">残り</span>
        <span class="value" id="aRemainValue">―</span>
      </div>
      <div class="perDay">
        <span class="label">1日あたり</span>
        <span class="value" id="aPerDayValue">―</span>
      </div>
    </div>
    <p class="subInfo" id="aSubInfo"></p>
    <div class="barOuter"><div class="barInner" id="aBarInner" style="width:0%"></div></div>
  </div>

  <div class="card">
    <div class="modeToggle" role="group" aria-label="秋菜の食費の入力方式">
      <button type="button" id="aModeSpent" class="active">使った金額</button>
      <button type="button" id="aModeRemaining">残りの金額</button>
    </div>
    <div class="amountRow">
      <input type="number" inputmode="numeric" id="aAmountInput" placeholder="使った金額" aria-label="秋菜の食費の金額を入力">
      <button type="button" id="aAddBtn">追加</button>
    </div>
    <input type="text" id="aMemoInput" placeholder="メモ（任意）" maxlength="100" aria-label="秋菜の食費のメモ">
    <p id="aRemainHint"></p>
    <p id="aFormError"></p>
  </div>

  <div class="card">
    <ul class="entries" id="aEntryList"></ul>
    <p class="emptyNote" id="aEmptyNote" style="display:none;">この期間の記録はまだありません。</p>
    <p class="loading" id="aListLoading">読み込み中…</p>
  </div>

  <div class="card">
    <button type="button" class="settingsToggle" id="aSettingsToggle">秋菜の設定（予算・給料日）</button>
    <div id="aSettingsBox">
      <div class="setRow">
        <label>予算 <input type="number" inputmode="numeric" id="aBudgetInput" min="1"> 円</label>
      </div>
      <div class="setRow">
        <label>給料日 毎月 <input type="number" inputmode="numeric" id="aPaydayInput" class="small" min="1" max="31"> 日</label>
      </div>
      <div class="setRow">
        <button type="button" id="aSaveSettingsBtn">保存</button>
        <span id="aSettingsMsg">保存しました</span>
      </div>
    </div>
  </div>

  <div class="card">
    <p class="cardTitle">買い物リスト</p>
    <div class="shopRow">
      <input type="text" id="shopInput" placeholder="買うものを入力" maxlength="100" aria-label="買うものを入力">
      <button type="button" id="shopAddBtn" disabled>追加</button>
    </div>
    <ul class="shopList" id="shopList"></ul>
    <p class="emptyNote" id="shopEmptyNote" style="display:none;">買い物リストは空です。</p>
    <button type="button" id="clearDoneBtn">買ったものをまとめて削除</button>
  </div>


  <div class="card">
    <div class="modeToggle" role="group" aria-label="入力方式">
      <button type="button" id="modeSpent" class="active">使った金額</button>
      <button type="button" id="modeRemaining">残りの金額</button>
    </div>
    <div class="amountRow">
      <input type="number" inputmode="numeric" id="amountInput" placeholder="使った金額" aria-label="金額を入力">
      <button type="button" id="addBtn">追加</button>
    </div>
    <input type="text" id="memoInput" placeholder="メモ（任意）" maxlength="100" aria-label="メモ">
    <p id="remainHint"></p>
    <p id="formError"></p>
  </div>


  <div class="card">
    <ul class="entries" id="entryList"></ul>
    <p class="emptyNote" id="emptyNote" style="display:none;">この期間の記録はまだありません。</p>
    <p class="loading" id="listLoading">読み込み中…</p>
  </div>

  <div class="card">
    <button type="button" class="settingsToggle" id="settingsToggle">設定（予算・給料日）</button>
    <div id="settingsBox">
      <div class="setRow">
        <label>予算 <input type="number" inputmode="numeric" id="budgetInput" min="1"> 円</label>
      </div>
      <div class="setRow">
        <label>給料日 毎月 <input type="number" inputmode="numeric" id="paydayInput" class="small" min="1" max="31"> 日</label>
      </div>
      <div class="setRow">
        <button type="button" id="saveSettingsBtn">保存</button>
        <span id="settingsMsg">保存しました</span>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
(function(){
  "use strict";
  var firebaseConfig = {
    apiKey: "AIzaSyAKG6Y-8hEMctNB0S8ra71RS1by8bsw7Ko",
    authDomain: "shokuhi-app-b2f37.firebaseapp.com",
    databaseURL: "https://shokuhi-app-b2f37-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "shokuhi-app-b2f37",
    storageBucket: "shokuhi-app-b2f37.firebasestorage.app",
    messagingSenderId: "733114796281",
    appId: "1:733114796281:web:5cd5ba68a6472a383eba28"
  };
  var ROOM_PATH = "FMoSLwqgcrNWia1C9MJVO8YJxJTU";
  var DEFAULT_SETTINGS = { budget: 30000, payday: 10 };

  firebase.initializeApp(firebaseConfig);
  var db = firebase.database();
  var rootRef = db.ref(ROOM_PATH);
  var settingsRef = rootRef.child("settings");
  var entriesRef = rootRef.child("entries");
  var shoppingRef = rootRef.child("shopping");
  var akinaRef = rootRef.child("akina");
  var aSettingsRef = akinaRef.child("settings");
  var aEntriesRef = akinaRef.child("entries");

  var settings = null;
  var entriesMap = {};
  var shoppingMap = {};
  var loaded = false;
  var mode = "spent";
  var aSettings = null;
  var aEntriesMap = {};
  var aMode = "spent";

  var $ = function(id){ return document.getElementById(id); };
  var syncStatus = $("syncStatus");

  db.ref(".info/connected").on("value", function(snap){
    if (snap.val() === true) {
      syncStatus.textContent = "同期済み";
      syncStatus.className = "ok";
    } else {
      syncStatus.textContent = "接続中…";
      syncStatus.className = "";
    }
  });

  function pad2(n){ return String(n).padStart(2, "0"); }
  function daysInMonth(y, m){ return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
  function jstTodayParts(){
    var s = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit"
    }).format(new Date());
    var p = s.split("-").map(Number);
    return { y: p[0], m: p[1], d: p[2] };
  }
  function jstTodayStr(){
    var t = jstTodayParts();
    return t.y + "-" + pad2(t.m) + "-" + pad2(t.d);
  }
  function foodPeriod(payday){
    var t = jstTodayParts();
    var sy = t.y, sm = t.m;
    var sd = Math.min(payday, daysInMonth(sy, sm));
    if (t.d < sd) {
      sm -= 1;
      if (sm < 1) { sm = 12; sy -= 1; }
      sd = Math.min(payday, daysInMonth(sy, sm));
    }
    var ny = sy, nm = sm + 1;
    if (nm > 12) { nm = 1; ny += 1; }
    var nextPayMs = Date.UTC(ny, nm - 1, Math.min(payday, daysInMonth(ny, nm)));
    var endMs = nextPayMs - 86400000;
    var end = new Date(endMs);
    var fmt = function(y, m, d){ return y + "-" + pad2(m) + "-" + pad2(d); };
    var start = fmt(sy, sm, sd);
    var endStr = fmt(end.getUTCFullYear(), end.getUTCMonth() + 1, end.getUTCDate());
    var todayMs = Date.UTC(t.y, t.m - 1, t.d);
    var daysLeft = Math.round((endMs - todayMs) / 86400000) + 1;
    return { start: start, end: endStr, daysLeft: daysLeft };
  }
  function mdLabel(dateStr){
    var p = dateStr.split("-");
    return Number(p[1]) + "/" + Number(p[2]);
  }
  function yen(n){ return n.toLocaleString("ja-JP") + "円"; }

  function currentEntries(period){
    var list = [];
    Object.keys(entriesMap).forEach(function(key){
      var e = entriesMap[key];
      if (e && e.date >= period.start && e.date <= period.end) {
        list.push({ key: key, date: e.date, ts: e.ts || 0, amount: e.amount || 0,
                    memo: e.memo || "", mode: e.mode || "spent",
                    target_remaining: (typeof e.target_remaining === "number") ? e.target_remaining : null });
      }
    });
    list.sort(function(a, b){ return (b.ts - a.ts) || (a.key < b.key ? 1 : -1); });
    return list;
  }

  function render(){
    if (!settings) return;
    var period = foodPeriod(settings.payday);
    var list = currentEntries(period);
    var spent = list.reduce(function(sum, e){ return sum + e.amount; }, 0);
    var remaining = settings.budget - spent;
    var perDay = (remaining > 0 && period.daysLeft > 0) ? Math.floor(remaining / period.daysLeft) : 0;

    $("periodLabel").textContent = mdLabel(period.start) + "〜" + mdLabel(period.end) +
      "（給料日 毎月" + settings.payday + "日）";
    var rv = $("remainValue");
    rv.textContent = yen(remaining);
    rv.className = "value" + (remaining < 0 ? " negative" : "");
    $("perDayValue").textContent = yen(perDay);
    $("subInfo").textContent = "使った合計 " + yen(spent) + " ／ 予算 " + yen(settings.budget) +
      " ・ あと" + period.daysLeft + "日";
    var pct = settings.budget > 0 ? (spent / settings.budget) * 100 : 0;
    var bar = $("barInner");
    bar.style.width = Math.min(100, Math.max(0, pct)) + "%";
    bar.className = "barInner" + (spent > settings.budget ? " over" : "");

    $("listLoading").style.display = "none";
    $("emptyNote").style.display = list.length === 0 ? "block" : "none";
    var ul = $("entryList");
    ul.innerHTML = "";
    list.forEach(function(e){
      var li = document.createElement("li");
      var dateSpan = document.createElement("span");
      dateSpan.className = "eDate";
      dateSpan.textContent = mdLabel(e.date);
      li.appendChild(dateSpan);
      var body = document.createElement("span");
      body.className = "eBody";
      if (e.mode === "remaining") {
        var badge = document.createElement("span");
        badge.className = "eBadge";
        badge.textContent = "残り入力";
        body.appendChild(badge);
        body.appendChild(document.createTextNode("残り " +
          (e.target_remaining !== null ? yen(e.target_remaining) : "―")));
        var delta = document.createElement("span");
        delta.className = "eDelta";
        delta.textContent = "（使った分 " + (e.amount >= 0 ? "+" : "−") + yen(Math.abs(e.amount)) + "）";
        body.appendChild(delta);
        if (e.memo) {
          var memo = document.createElement("span");
          memo.className = "eMemo";
          memo.textContent = e.memo;
          body.appendChild(memo);
        }
      } else {
        body.textContent = e.memo ? e.memo : "食費";
      }
      li.appendChild(body);
      if (e.mode === "spent") {
        var amt = document.createElement("span");
        amt.className = "eAmount";
        amt.textContent = yen(e.amount);
        li.appendChild(amt);
      }
      var del = document.createElement("button");
      del.type = "button";
      del.className = "eDel";
      del.textContent = "×";
      del.setAttribute("aria-label", "この記録を削除");
      del.addEventListener("click", function(){
        entriesRef.child(e.key).remove().catch(function(){
          showError("削除できませんでした。もう一度試してください。");
        });
      });
      li.appendChild(del);
      ul.appendChild(li);
    });

    updateHint(spent);
    validateForm(spent);
    renderShop();
  }

  function shopItems(){
    var list = [];
    Object.keys(shoppingMap).forEach(function(key){
      var it = shoppingMap[key];
      if (it && typeof it.name === "string" && it.name) {
        list.push({ key: key, name: it.name, done: !!it.done, ts: it.ts || 0 });
      }
    });
    list.sort(function(a, b){
      if (a.done !== b.done) return a.done ? 1 : -1;
      return (a.ts - b.ts) || (a.key < b.key ? -1 : 1);
    });
    return list;
  }

  function renderShop(){
    var list = shopItems();
    $("shopEmptyNote").style.display = list.length === 0 ? "block" : "none";
    $("clearDoneBtn").style.display =
      list.some(function(it){ return it.done; }) ? "block" : "none";
    var ul = $("shopList");
    ul.innerHTML = "";
    list.forEach(function(it){
      var li = document.createElement("li");
      if (it.done) li.className = "done";
      var check = document.createElement("input");
      check.type = "checkbox";
      check.className = "sCheck";
      check.checked = it.done;
      check.setAttribute("aria-label", it.name + "を買ったことにする");
      check.addEventListener("change", function(){
        shoppingRef.child(it.key).child("done").set(check.checked).catch(function(){
          showError("更新できませんでした。もう一度試してください。");
        });
      });
      li.appendChild(check);
      var name = document.createElement("span");
      name.className = "sName";
      name.textContent = it.name;
      name.addEventListener("click", function(){
        shoppingRef.child(it.key).child("done").set(!it.done).catch(function(){
          showError("更新できませんでした。もう一度試してください。");
        });
      });
      li.appendChild(name);
      var del = document.createElement("button");
      del.type = "button";
      del.className = "sDel";
      del.textContent = "×";
      del.setAttribute("aria-label", it.name + "を削除");
      del.addEventListener("click", function(){
        shoppingRef.child(it.key).remove().catch(function(){
          showError("削除できませんでした。もう一度試してください。");
        });
      });
      li.appendChild(del);
      ul.appendChild(li);
    });
  }

  function submitShopItem(){
    var name = $("shopInput").value.trim().slice(0, 100);
    if (!name) return;
    shoppingRef.push({ name: name, done: false, ts: Date.now() }).then(function(){
      $("shopInput").value = "";
      $("shopAddBtn").disabled = true;
      $("shopInput").focus();
    }).catch(function(){
      showError("追加できませんでした。もう一度試してください。");
    });
  }
  $("shopInput").addEventListener("input", function(){
    $("shopAddBtn").disabled = !$("shopInput").value.trim();
  });
  $("shopAddBtn").addEventListener("click", submitShopItem);
  $("shopInput").addEventListener("keydown", function(e){
    if (e.key === "Enter") { e.preventDefault(); submitShopItem(); }
  });
  $("clearDoneBtn").addEventListener("click", function(){
    shopItems().forEach(function(it){
      if (it.done) shoppingRef.child(it.key).remove();
    });
  });

  function updateHint(spent){
    var hint = $("remainHint");
    if (mode !== "remaining" || !settings) { hint.style.display = "none"; return; }
    var v = parseInt($("amountInput").value, 10);
    if (isNaN(v) || v < 0) { hint.style.display = "none"; return; }
    hint.textContent = "残り " + yen(v) + " に合わせます（使った合計は " +
      yen(settings.budget - v) + " になります）。";
    hint.style.display = "block";
  }

  function formSpentTotal(){
    if (!settings) return 0;
    var period = foodPeriod(settings.payday);
    return currentEntries(period).reduce(function(sum, e){ return sum + e.amount; }, 0);
  }
  function inputValid(){
    var v = parseInt($("amountInput").value, 10);
    if (isNaN(v)) return false;
    return mode === "spent" ? v >= 1 : v >= 0;
  }
  function validateForm(){
    $("addBtn").disabled = !settings || !inputValid();
  }
  function showError(msg){
    var el = $("formError");
    el.textContent = msg;
    el.style.display = "block";
    setTimeout(function(){ el.style.display = "none"; }, 4000);
  }

  function submitEntry(){
    if (!settings || !inputValid()) return;
    var v = parseInt($("amountInput").value, 10);
    var memo = $("memoInput").value.trim().slice(0, 100);
    var entry;
    if (mode === "spent") {
      entry = { date: jstTodayStr(), ts: Date.now(), amount: v, memo: memo,
                mode: "spent", target_remaining: null };
    } else {
      var spent = formSpentTotal();
      var delta = settings.budget - v - spent;
      entry = { date: jstTodayStr(), ts: Date.now(), amount: delta, memo: memo,
                mode: "remaining", target_remaining: v };
    }
    entriesRef.push(entry).then(function(){
      $("amountInput").value = "";
      $("memoInput").value = "";
      validateForm();
      updateHint(formSpentTotal());
    }).catch(function(){
      showError("記録できませんでした。もう一度試してください。");
    });
  }

  function setMode(m){
    mode = m;
    $("modeSpent").className = m === "spent" ? "active" : "";
    $("modeRemaining").className = m === "remaining" ? "active" : "";
    $("amountInput").placeholder = m === "spent" ? "使った金額" : "今の残り金額";
    validateForm();
    updateHint(formSpentTotal());
  }
  $("modeSpent").addEventListener("click", function(){ setMode("spent"); });
  $("modeRemaining").addEventListener("click", function(){ setMode("remaining"); });
  $("amountInput").addEventListener("input", function(){
    validateForm();
    updateHint(formSpentTotal());
  });
  $("addBtn").addEventListener("click", submitEntry);
  $("amountInput").addEventListener("keydown", function(e){
    if (e.key === "Enter") { e.preventDefault(); submitEntry(); }
  });
  $("memoInput").addEventListener("keydown", function(e){
    if (e.key === "Enter") { e.preventDefault(); submitEntry(); }
  });

  $("settingsToggle").addEventListener("click", function(){
    if (settings) {
      $("budgetInput").value = settings.budget;
      $("paydayInput").value = settings.payday;
    }
    $("settingsBox").classList.toggle("open");
  });
  function validateSettings(){
    var b = parseInt($("budgetInput").value, 10);
    var p = parseInt($("paydayInput").value, 10);
    $("saveSettingsBtn").disabled =
      isNaN(b) || b < 1 || isNaN(p) || p < 1 || p > 31;
  }
  $("budgetInput").addEventListener("input", validateSettings);
  $("paydayInput").addEventListener("input", validateSettings);
  $("saveSettingsBtn").addEventListener("click", function(){
    var b = parseInt($("budgetInput").value, 10);
    var p = parseInt($("paydayInput").value, 10);
    if (isNaN(b) || b < 1 || isNaN(p) || p < 1 || p > 31) return;
    settingsRef.set({ budget: b, payday: p }).then(function(){
      var msg = $("settingsMsg");
      msg.style.display = "inline";
      setTimeout(function(){ msg.style.display = "none"; }, 2500);
    }).catch(function(){
      showError("設定を保存できませんでした。もう一度試してください。");
    });
  });

  // ===== 秋菜の食費（別ノード akina 配下。本体とは独立） =====
  function aCurrentEntries(period){
    var list = [];
    Object.keys(aEntriesMap).forEach(function(key){
      var e = aEntriesMap[key];
      if (e && e.date >= period.start && e.date <= period.end) {
        list.push({ key: key, date: e.date, ts: e.ts || 0, amount: e.amount || 0,
                    memo: e.memo || "", mode: e.mode || "spent",
                    target_remaining: (typeof e.target_remaining === "number") ? e.target_remaining : null });
      }
    });
    list.sort(function(a, b){ return (b.ts - a.ts) || (a.key < b.key ? 1 : -1); });
    return list;
  }

  function aRender(){
    if (!aSettings) return;
    var period = foodPeriod(aSettings.payday);
    var list = aCurrentEntries(period);
    var spent = list.reduce(function(sum, e){ return sum + e.amount; }, 0);
    var remaining = aSettings.budget - spent;
    var perDay = (remaining > 0 && period.daysLeft > 0) ? Math.floor(remaining / period.daysLeft) : 0;

    $("aPeriodLabel").textContent = mdLabel(period.start) + "〜" + mdLabel(period.end) +
      "（給料日 毎月" + aSettings.payday + "日）";
    var rv = $("aRemainValue");
    rv.textContent = yen(remaining);
    rv.className = "value" + (remaining < 0 ? " negative" : "");
    $("aPerDayValue").textContent = yen(perDay);
    $("aSubInfo").textContent = "使った合計 " + yen(spent) + " ／ 予算 " + yen(aSettings.budget) +
      " ・ あと" + period.daysLeft + "日";
    var pct = aSettings.budget > 0 ? (spent / aSettings.budget) * 100 : 0;
    var bar = $("aBarInner");
    bar.style.width = Math.min(100, Math.max(0, pct)) + "%";
    bar.className = "barInner" + (spent > aSettings.budget ? " over" : "");

    $("aListLoading").style.display = "none";
    $("aEmptyNote").style.display = list.length === 0 ? "block" : "none";
    var ul = $("aEntryList");
    ul.innerHTML = "";
    list.forEach(function(e){
      var li = document.createElement("li");
      var dateSpan = document.createElement("span");
      dateSpan.className = "eDate";
      dateSpan.textContent = mdLabel(e.date);
      li.appendChild(dateSpan);
      var body = document.createElement("span");
      body.className = "eBody";
      if (e.mode === "remaining") {
        var badge = document.createElement("span");
        badge.className = "eBadge";
        badge.textContent = "残り入力";
        body.appendChild(badge);
        body.appendChild(document.createTextNode("残り " +
          (e.target_remaining !== null ? yen(e.target_remaining) : "―")));
        var delta = document.createElement("span");
        delta.className = "eDelta";
        delta.textContent = "（使った分 " + (e.amount >= 0 ? "+" : "−") + yen(Math.abs(e.amount)) + "）";
        body.appendChild(delta);
        if (e.memo) {
          var memo = document.createElement("span");
          memo.className = "eMemo";
          memo.textContent = e.memo;
          body.appendChild(memo);
        }
      } else {
        body.textContent = e.memo ? e.memo : "食費";
      }
      li.appendChild(body);
      if (e.mode === "spent") {
        var amt = document.createElement("span");
        amt.className = "eAmount";
        amt.textContent = yen(e.amount);
        li.appendChild(amt);
      }
      var del = document.createElement("button");
      del.type = "button";
      del.className = "eDel";
      del.textContent = "×";
      del.setAttribute("aria-label", "この記録を削除");
      del.addEventListener("click", function(){
        aEntriesRef.child(e.key).remove().catch(function(){
          aShowError("削除できませんでした。もう一度試してください。");
        });
      });
      li.appendChild(del);
      ul.appendChild(li);
    });

    aUpdateHint(spent);
    aValidateForm(spent);
  }

  function aShowError(msg){
    var el = $("aFormError");
    el.textContent = msg;
    el.style.display = "block";
    setTimeout(function(){ el.style.display = "none"; }, 4000);
  }
  function aUpdateHint(spent){
    var hint = $("aRemainHint");
    if (aMode !== "remaining" || !aSettings) { hint.style.display = "none"; return; }
    var v = parseInt($("aAmountInput").value, 10);
    if (isNaN(v) || v < 0) { hint.style.display = "none"; return; }
    hint.textContent = "残り " + yen(v) + " に合わせます（使った合計は " +
      yen(aSettings.budget - v) + " になります）。";
    hint.style.display = "block";
  }
  function aFormSpentTotal(){
    if (!aSettings) return 0;
    var period = foodPeriod(aSettings.payday);
    return aCurrentEntries(period).reduce(function(sum, e){ return sum + e.amount; }, 0);
  }
  function aInputValid(){
    var v = parseInt($("aAmountInput").value, 10);
    if (isNaN(v)) return false;
    return aMode === "spent" ? v >= 1 : v >= 0;
  }
  function aValidateForm(){
    $("aAddBtn").disabled = !aSettings || !aInputValid();
  }
  function aSubmitEntry(){
    if (!aSettings || !aInputValid()) return;
    var v = parseInt($("aAmountInput").value, 10);
    var memo = $("aMemoInput").value.trim().slice(0, 100);
    var entry;
    if (aMode === "spent") {
      entry = { date: jstTodayStr(), ts: Date.now(), amount: v, memo: memo,
                mode: "spent", target_remaining: null };
    } else {
      var spent = aFormSpentTotal();
      var delta = aSettings.budget - v - spent;
      entry = { date: jstTodayStr(), ts: Date.now(), amount: delta, memo: memo,
                mode: "remaining", target_remaining: v };
    }
    aEntriesRef.push(entry).then(function(){
      $("aAmountInput").value = "";
      $("aMemoInput").value = "";
      aValidateForm();
      aUpdateHint(aFormSpentTotal());
    }).catch(function(){
      aShowError("記録できませんでした。もう一度試してください。");
    });
  }
  function aSetMode(m){
    aMode = m;
    $("aModeSpent").className = m === "spent" ? "active" : "";
    $("aModeRemaining").className = m === "remaining" ? "active" : "";
    $("aAmountInput").placeholder = m === "spent" ? "使った金額" : "今の残り金額";
    aValidateForm();
    aUpdateHint(aFormSpentTotal());
  }
  $("aModeSpent").addEventListener("click", function(){ aSetMode("spent"); });
  $("aModeRemaining").addEventListener("click", function(){ aSetMode("remaining"); });
  $("aAmountInput").addEventListener("input", function(){
    aValidateForm();
    aUpdateHint(aFormSpentTotal());
  });
  $("aAddBtn").addEventListener("click", aSubmitEntry);
  $("aAmountInput").addEventListener("keydown", function(e){
    if (e.key === "Enter") { e.preventDefault(); aSubmitEntry(); }
  });
  $("aMemoInput").addEventListener("keydown", function(e){
    if (e.key === "Enter") { e.preventDefault(); aSubmitEntry(); }
  });

  $("aSettingsToggle").addEventListener("click", function(){
    if (aSettings) {
      $("aBudgetInput").value = aSettings.budget;
      $("aPaydayInput").value = aSettings.payday;
    }
    $("aSettingsBox").classList.toggle("open");
  });
  function aValidateSettings(){
    var b = parseInt($("aBudgetInput").value, 10);
    var p = parseInt($("aPaydayInput").value, 10);
    $("aSaveSettingsBtn").disabled =
      isNaN(b) || b < 1 || isNaN(p) || p < 1 || p > 31;
  }
  $("aBudgetInput").addEventListener("input", aValidateSettings);
  $("aPaydayInput").addEventListener("input", aValidateSettings);
  $("aSaveSettingsBtn").addEventListener("click", function(){
    var b = parseInt($("aBudgetInput").value, 10);
    var p = parseInt($("aPaydayInput").value, 10);
    if (isNaN(b) || b < 1 || isNaN(p) || p < 1 || p > 31) return;
    aSettingsRef.set({ budget: b, payday: p }).then(function(){
      var msg = $("aSettingsMsg");
      msg.style.display = "inline";
      setTimeout(function(){ msg.style.display = "none"; }, 2500);
    }).catch(function(){
      aShowError("設定を保存できませんでした。もう一度試してください。");
    });
  });

  rootRef.on("value", function(snap){
    var data = snap.val() || {};
    if (!data.settings) {
      settings = { budget: DEFAULT_SETTINGS.budget, payday: DEFAULT_SETTINGS.payday };
      settingsRef.set(settings);
    } else {
      settings = {
        budget: (typeof data.settings.budget === "number") ? data.settings.budget : DEFAULT_SETTINGS.budget,
        payday: (typeof data.settings.payday === "number") ? data.settings.payday : DEFAULT_SETTINGS.payday
      };
    }
    entriesMap = data.entries || {};
    shoppingMap = data.shopping || {};
    var akinaData = data.akina || {};
    if (!akinaData.settings) {
      aSettings = { budget: DEFAULT_SETTINGS.budget, payday: DEFAULT_SETTINGS.payday };
      aSettingsRef.set(aSettings);
    } else {
      aSettings = {
        budget: (typeof akinaData.settings.budget === "number") ? akinaData.settings.budget : DEFAULT_SETTINGS.budget,
        payday: (typeof akinaData.settings.payday === "number") ? akinaData.settings.payday : DEFAULT_SETTINGS.payday
      };
    }
    aEntriesMap = akinaData.entries || {};
    loaded = true;
    render();
    aRender();
  }, function(err){
    syncStatus.textContent = "読み込めませんでした";
    syncStatus.className = "err";
  });
})();
</script>
</body>
</html>
